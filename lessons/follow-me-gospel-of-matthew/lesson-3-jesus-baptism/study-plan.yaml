items:
  - id: p1
    type: prayer
    title: Opening prayer
    prompt: Pray that you will understand the importance of the following events.
    teach: |
      “Many years later, after Jesus reached adulthood, he went out to see his cousin John who was in the desert baptizing those who were repenting of their sins.” That would have been a nice transition for Matthew to give us between Chapters 2 and 3! But he didn’t. At the beginning of Chapter 3, we have an abrupt shift from the description of Jesus’ birth to a description of John the Baptist.

      Isn’t Matthew’s focus on Jesus the Messiah? Oh yes it is, and that is exactly why he includes the person and perspective of John. John makes sure that we concern ourselves with who the Messiah is and what He does. And then Matthew concludes his account with a shocking, dramatic event full of supernatural special effects.

      Let’s see what we are to learn from Matthew 3.
  - id: r1
    type: bible-reading
    reference: Matthew 3:1-12
    teach: |
      We begin with the ministry of John the Baptist — the forerunner who prepares the way for the Messiah.
  - id: q1
    type: question
    number: 1
    text: Just who is John the Baptist and what is he all about? Describe him and his mission based on the passage you just read.
  - id: q2
    type: question
    number: 2
    text: How does John 1:6-8 describe John the Baptist?
    teach: |
      The three other gospels also present John the Baptist as the important forerunner to Jesus. His birth is described in Luke 1. Mark 1:3-8 and Luke 3:2-17 summarize his ministry in the wilderness just as Matthew does, almost word for word. He had the same lifestyle and radical message as that of an Old Testament prophet. Elijah was his role model in many ways, including the way he dressed (2 Kings 1:8)! The gospel of John condenses his role into three short verses.
  - id: t1
    type: teaching
    teach: |
      As John bore witness that the Messiah was coming, he urged the people to prepare for Him by repenting of their sins. *Repent and be baptized – for the kingdom of heaven is at hand.* This was his message.

      **Word Study: Baptize.** The Greek word *baptize* comes from the root *bapto*, which literally means to dip or to dye. It was a common word among those in the fuller’s trade. Undressed cloth was prepared for use by first dipping it into bleach and then into dye. The emphasis in the word is not on the procedure of dipping but rather on the result of the procedure. The cloth woven of unprocessed sheep’s wool was dull and it needed to be cleansed. The appearance of the cloth was changed by putting the cloth into the bleach and then into dye. When it emerged from the bleach, it was clean and white; and when it emerged from the dye, its appearance was further altered. The word metaphorically means to change identity, to change appearance, or even to change relationships.

      Repent and be baptized. It’s the very message that Jesus Himself preached. “From that time Jesus began to preach and say, ‘Repent, for the kingdom of heaven is at hand.’” (Matthew 4:17). The kingdom of heaven is a very important concept in the book of Matthew.
  - id: r2
    type: bible-reading
    reference: Matthew 3:7-12
    teach: |
      John also had a sharp word for the religious leaders who came out to him. Let’s look carefully at that confrontation.
  - id: q3
    type: question
    number: 3
    text: Who is being addressed in this passage?
  - id: q4
    type: question
    number: 4
    text: How are they described?
    teach: |
      The Pharisees and Sadducees were the religious leaders of the times. These two distinct groups made up the council known as the Sanhedrin. The Pharisees were connected with local synagogues; they studied the Law of the Old Testament and adhered strictly to the oral interpretations of the Law and to their ancestral traditions. The Pharisees represented the broad masses of the Jewish people. The Sadducees, on the other hand, were a small aristocratic group from which came the powerful High Priest. They did not believe in life after death or the resurrection of the body, or in future punishment as part of judgment.
  - id: q5
    type: question
    number: 5
    text: In the passage you just read, how does John rebuke these two groups?
  - id: q6
    type: question
    number: 6
    text: What is the hope and the promise for those who repent, according to Matthew 3:11-12?
    teach: |
      The ax is lying at the root of the trees. The time will come when the Judge will pick up the ax and chop down each tree that does not bear good fruit. The rest of John’s message tells of the hope of those who repent and the horror of those who don’t.
  - id: q7
    type: question
    number: 7
    text: What is the horror to come for those who do not repent, according to Matthew 3:11-12?
  - id: q8
    type: question
    number: 8
    text: If you have repented of your sins and trusted in Jesus as the One who forgives your sins, what is the truth declared in Ephesians 1:13-14?
    teach: |
      Which would you choose? I hope you have already made your choice and that you are ready for the arrival of the King. Obeying the word of God by the power of the Holy Spirit — that’s how we are to live our lives. It was first modeled to us by Jesus Himself, as we will see in the next passage.
  - id: r3
    type: bible-reading
    reference: Matthew 3:13-17
    teach: |
      I’d like to show you the impact that the nuances of the Greek language make on a few sentences. I hope it will help you see what was out of the ordinary in this event. Notice especially the imperative command and the repeated “behold!”

      “Then Jesus Himself came…and John tried to prevent Him saying, ‘I have a need to be baptized by You’…but Jesus said, ‘**Permit it now**…’ After Jesus had been baptized…*behold!*… the heavens were opened and he saw the Spirit of God descending like a dove and alighting on Him. And *behold!* a voice came from heaven, saying, ‘This is My beloved Son, in whom I am well pleased.’”
  - id: q9
    type: question
    number: 9
    text: Looking at your Bible and the translation provided, describe the surprising aspects of this event (verses 13-14, 15, 16, and 17).
  - id: q10
    type: question
    number: 10
    text: Why did Jesus say He was to be baptized? (Record what He said.)
    teach: |
      Do these things surprise you? That Jesus came to be baptized? That the Holy Spirit came upon Him? That God spoke? These are the very things that Matthew emphasized in this account. Why did Jesus need to be baptized? Did He receive the Holy Spirit at this time? Had Jesus done something to make His heavenly Father pleased with Him? Let’s consider these questions.
  - id: q11
    type: reflection
    number: 11
    text: How do you respond when you are given instructions that you don’t quite understand? Do you submit to the ways of the Lord even when they don’t make sense to you?
    teach: |
      I think this is hard to understand! The key is understanding how Matthew used the word *righteousness*. We need to remember throughout our study of his book that he was a Jew, writing for a Jewish audience. Some even say that this gospel was first written in Hebrew then translated into Greek. Matthew would have understood the Hebrew concepts of the words he used.

      In the Old Testament, the word for righteousness is “*tsedeqah*.” The Greek word “*dikaiosune*” then, in Matthew’s context means: what God requires; what is right; religious duties or acts of charity. So Jesus was telling John, “You must baptize me because it is the right thing to do. It is what God wants.”

      Commentators say that Jesus’ baptism gave approval to John’s ministry and linked the two ministries together, providing the transition from the one to the other. It was time for Jesus to be in the spotlight. It was time for a supernatural revelation of who He was.
  - id: q12
    type: question
    number: 12
    text: What does Isaiah 11:1-2 tell you about the Holy Spirit?
  - id: q13
    type: question
    number: 13
    text: What does John 1:32-34 tell you about the Holy Spirit coming upon Jesus?
    teach: |
      Jesus had been conceived by the Holy Spirit and therefore had been filled with the Spirit from the womb, but His baptism was a special ceremony. The conclusion to this spectacular event is an announcement from heaven. It reflects two messianic passages from the Old Testament.
  - id: q14
    type: question
    number: 14
    text: How does Matthew 3:17 relate to Psalm 2:7 and Isaiah 42:1?
    teach: |
      Behold! The voice of the Lord! Jesus had not even begun His ministry, but God the Father was pleased with Him and declared His love for Him. Jesus was the Son, the Servant, and the Beloved. He had already demonstrated obedience in fulfilling all righteousness. He was anointed with the Spirit and empowered to begin His mission. The first three chapters of Matthew make it clear that Jesus was no ordinary man.
